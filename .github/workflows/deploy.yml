# ─────────────────────────────────────────────────────────────
# CI/CD — Inmobiliaria RyB y Asociados
#
# FLUJO:
#   push a main → lint → build → deploy a Firebase Hosting
#   PRs        → lint + build (sin deploy)
#
# SECRETS requeridos en GitHub → Settings → Secrets → Actions:
#
#   FIREBASE_SERVICE_ACCOUNT   → JSON de cuenta de servicio Firebase
#
#   # Firebase core
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_DATABASE_URL
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#   VITE_FIREBASE_MEASUREMENT_ID
#
#   # App Check (reCAPTCHA v3)
#   VITE_FIREBASE_APP_CHECK_KEY
#
#   # Cloud Messaging (Web Push certificate)
#   VITE_VAPID_KEY          # ← corregido: antes VITE_FIREBASE_VAPID_KEY (no coincidía con el código cliente)
#
#   # Google Maps
#   VITE_GOOGLE_MAPS_API_KEY
#
#   # WhatsApp Business
#   VITE_WA_NUMBER
#
#   # Opcional: sobrescribir URL base de Cloud Functions
#   # VITE_FUNCTIONS_BASE_URL
# ─────────────────────────────────────────────────────────────

name: CI and Deploy Firebase

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-deploy:
    name: Lint Test Build Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install client deps
        run: npm ci

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL:        ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID:      ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_APP_CHECK_KEY:       ${{ secrets.VITE_FIREBASE_APP_CHECK_KEY }}
          # ★ FIX: el cliente usa VITE_VAPID_KEY (no VITE_FIREBASE_VAPID_KEY).
          VITE_VAPID_KEY:                    ${{ secrets.VITE_VAPID_KEY }}
          # ★ FIX: faltaban estas variables → Maps, WhatsApp y Functions URL
          #         quedaban undefined en producción.
          VITE_GOOGLE_MAPS_API_KEY:          ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_WA_NUMBER:                    ${{ secrets.VITE_WA_NUMBER }}
          VITE_FUNCTIONS_BASE_URL:           ${{ secrets.VITE_FUNCTIONS_BASE_URL }}
        run: npm run build
      - name: Install Firebase CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: firebase deploy --only firestore:rules --project inmobiliaria-ryb-y-asociados --non-interactive

      - name: Deploy Storage rules
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: firebase deploy --only storage:rules --project inmobiliaria-ryb-y-asociados --non-interactive

      - name: Deploy Functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: firebase deploy --only functions --project inmobiliaria-ryb-y-asociados --non-interactive

      - name: Deploy Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: firebase deploy --only hosting:production --project inmobiliaria-ryb-y-asociados --non-interactive